<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ניהול – ליזה</title>
<meta name="theme-color" content="#2b2140">
<link rel="manifest" href="manifest-admin.json">
<link rel="icon" href="icon-admin.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-admin-192.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Rubik,"Segoe UI",Arial,sans-serif;background:#f3f0f8;color:#2b2140;padding:calc(14px + env(safe-area-inset-top)) 14px 40px}
  #app{max-width:620px;margin:0 auto}
  button,input,textarea,select{font-family:inherit;font-size:16px}
  button{cursor:pointer;border:0}
  h1{font-size:22px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .box{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(40,20,80,.06)}
  .box h2{font-size:17px;margin-bottom:10px}
  .muted{color:#7a6f92;font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:12px}
  .stats div{background:#f6f2fd;border-radius:14px;padding:10px 4px}
  .stats b{display:block;font-size:22px}
  .stats span{font-size:12.5px;color:#7a6f92}
  .top{display:flex;align-items:center;gap:14px}
  .ring{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;flex:none}
  .ring b{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px}
  .verdict{margin-top:12px;padding:10px 12px;border-radius:12px;font-size:15px}
  .meter{height:9px;background:#eee8f8;border-radius:5px;overflow:hidden;margin-top:4px}
  .meter i{display:block;height:100%;border-radius:5px;background:#8b5cf6}
  .topic{margin-bottom:10px;font-size:14.5px}
  .topic>div:first-child{display:flex;justify-content:space-between}
  .chart{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid #e6def5;padding-top:16px}
  .chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10.5px;color:#7a6f92}
  .chart i{display:block;width:100%;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#ec4899,#8b5cf6);min-height:2px}
  .chart i.goal{background:linear-gradient(180deg,#22c55e,#16a34a)}
  .chart small{font-size:10px}
  .days{display:flex;gap:4px;font-size:10px;color:#7a6f92;margin-top:4px}
  .days span{flex:1;min-width:0;text-align:center;white-space:nowrap}
  .chart div{min-width:0}
  body{overflow-x:hidden}
  .exam{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1ecf8;font-size:15px}
  .exam:last-child{border:0}
  .q{padding:10px 0;border-bottom:1px solid #f1ecf8;font-size:14.5px;line-height:1.5}
  .q:last-child{border:0}
  .q img{max-height:70px;max-width:120px;float:left;margin-right:8px;border-radius:6px}
  .q .c{color:#15803d;font-weight:700}
  .q .w{color:#c0262d;font-size:13px}
  textarea,input,select{width:100%;border:2px solid #e6def5;border-radius:12px;padding:10px;margin-top:6px;background:#fff}
  .btn{background:#8b5cf6;color:#fff;border-radius:12px;padding:11px 16px;font-weight:700}
  .btn.light{background:#ece4ff;color:#5b3fa8}
  .btn.small{padding:7px 12px;font-size:14px}
  .row{display:flex;gap:8px;margin-top:10px}
  .row>*{flex:1}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2b2140;color:#fff;padding:10px 18px;border-radius:14px;z-index:9}
  .center{text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Admin page: shows Liza's progress from the family Google Sheet.
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbzvi2cl7509dBy0b4IC0lCGn7SCWp1PizncMNuVMHlSygvirVN2A8AHjBQIegaw2DdGPg/exec';
const PIN_KEY = 'lizaAdminPin';
const PASS = 26;
const app = document.getElementById('app');
let pin = localStorage.getItem(PIN_KEY) || '', liza = null;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){ const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2200); }
function ago(t){
  if (!t) return 'עוד לא';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 2) return 'עכשיו';
  if (m < 60) return `לפני ${m} דקות`;
  const h = Math.round(m / 60);
  if (h < 24) return h === 1 ? 'לפני שעה' : `לפני ${h} שעות`;
  const d = Math.round(h / 24);
  return d === 1 ? 'אתמול' : `לפני ${d} ימים`;
}
const dkey = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
const dateStr = t => { const d = new Date(t); return d.getDate() + '/' + (d.getMonth() + 1) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };

function screenPin(err){
  app.innerHTML = `<h1>👑 ניהול – ליזה</h1>
  <div class="box center"><h2>קוד כניסה</h2>
  <p class="muted">אותו קוד של דוח ההורים באפליקציית האנגלית</p>
  <input id="pin" type="password" inputmode="numeric" style="text-align:center;font-size:22px" value="">
  ${err ? `<p style="color:#c0262d;margin-top:8px">${err}</p>` : ''}
  <div class="row"><button class="btn" onclick="enterPin()">כניסה</button></div></div>`;
  const i = document.getElementById('pin');
  i.focus(); i.onkeydown = e => { if (e.key === 'Enter') enterPin(); };
}
function enterPin(){ pin = document.getElementById('pin').value.trim(); if (pin) load(); }

async function load(){
  if (!pin) return screenPin();
  if (!liza) app.innerHTML = '<h1>👑 ניהול – ליזה</h1><div class="box center muted">טוען...</div>';
  try {
    const res = await (await fetch(SYNC_URL + '?pin=' + encodeURIComponent(pin) + '&t=' + Date.now())).json();
    if (!res.ok){ localStorage.removeItem(PIN_KEY); pin = ''; return screenPin(res.error === 'pin' ? 'הקוד לא נכון' : 'משהו השתבש, נסה שוב'); }
    try { localStorage.setItem(PIN_KEY, pin); } catch(e){}
    const rows = (res.kids || []).filter(k => k.app === 'theory');
    // Old version reported under one shared name that anyone with the link could write to: remove it.
    if (rows.some(k => k.id === 'liza-theory')) fetch(SYNC_URL, { method: 'POST', body: JSON.stringify({ action: 'parent', pin, id: 'liza-theory', remove: true }) }).catch(() => {});
    const mine = rows.filter(k => String(k.id).startsWith('theory-')).sort((x, y) => (y.lastPlayed || 0) - (x.lastPlayed || 0));
    liza = mine[0] || null;
    if (!liza) return createLink();
    render();
  } catch(e){
    if (liza) toast('אין חיבור לאינטרנט'); else app.innerHTML = '<h1>👑 ניהול – ליזה</h1><div class="box center">אין חיבור לאינטרנט<div class="row"><button class="btn" onclick="load()">לנסות שוב</button></div></div>';
  }
}

// First time: make Liza's secret personal code and save it in the sheet, so every admin device shows the same link.
async function createLink(){
  const abc = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const r = crypto.getRandomValues(new Uint32Array(10));
  const code = Array.from(r, x => abc[x % abc.length]).join('');
  try {
    await fetch(SYNC_URL, { method: 'POST', body: JSON.stringify({ action: 'progress', kid: { id: 'theory-' + code, app: 'theory', name: 'ליזה (תיאוריה)', levelName: 'תיאוריה', earned: 0, streak: 0, waiting: true } }) });
    load();
  } catch(e){ toast('אין חיבור לאינטרנט'); }
}
const lizaCode = () => String(liza.id).slice(7);
const lizaLink = () => location.origin + location.pathname.replace(/admin.html$/, '') + '#k=' + lizaCode();
function linkBox(){
  const text = 'ליזה, זה הקישור האישי שלך לאפליקציית התיאוריה 👑 ' + lizaLink();
  return `<div class="box"><h2>📲 הקישור האישי של ליזה</h2>
    <p class="muted">רק הטלפון שפותח את הקישור הזה מדווח לכאן. מי שפותח את הקישור הרגיל מתרגל לעצמו, ושום דבר לא נשלח לכאן. לא להעביר את הקישור הזה לאחרים.</p>
    <p dir="ltr" style="background:#f6f2fd;padding:10px;border-radius:12px;margin-top:8px;word-break:break-all;font-size:14px">${esc(lizaLink())}</p>
    <p class="muted" style="margin-top:6px">באייפון, אם היא כבר התקינה את האפליקציה: מסך הבית ← למטה "קוד אישי" ← <b dir="ltr">${esc(lizaCode())}</b></p>
    <div class="row"><a class="btn" style="text-align:center;text-decoration:none;background:#25d366" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank">שליחה בוואטסאפ</a><button class="btn light" onclick="copyLink()">העתקה</button></div></div>`;
}
function copyLink(){ navigator.clipboard.writeText(lizaLink()).then(() => toast('הקישור הועתק'), () => toast('לא הצלחתי להעתיק')); }

function render(){
  const head = `<h1>👑 ניהול – ליזה <button class="btn light small" onclick="load()">🔄 רענון</button></h1>`;
  if (!liza.total){
    app.innerHTML = head + `<div class="box center"><h2>ממתין לליזה</h2><p class="muted">שלח לליזה את הקישור האישי שלמטה. ברגע שהיא תפתח אותו (עם אינטרנט), ההתקדמות שלה תופיע כאן, כולל כל מה שכבר תרגלה בטלפון שלה.</p></div>` + linkBox();
    return;
  }
  const k = liza, p = k.parent || {}, exams = k.exams || [];
  let row = 0; for (let i = exams.length - 1; i >= 0 && exams[i].score >= PASS; i--) row++;
  const passedAll = exams.filter(e => e.score >= PASS).length;
  const lastEx = exams.slice(-5);
  const avg = lastEx.length ? Math.round(lastEx.reduce((s, e) => s + e.score, 0) / lastEx.length * 10) / 10 : null;
  let verdict;
  if (row >= 5) verdict = ['#e8f8ef', '✅ <b>מוכנה למבחן!</b> עברה 5 מבחנים ברצף. אפשר לקבוע טסט תיאוריה.'];
  else if (!exams.length) verdict = ['#fff4d6', '📝 עוד לא עשתה מבחן ניסיון. כדאי לעודד אותה לנסות מבחן אחד.'];
  else if (avg >= 24) verdict = ['#ece4ff', `💪 קרובה מאוד! מבחנים שעברה ברצף: ${row} מתוך 5. ממוצע ב-5 האחרונים: ${avg}`];
  else verdict = ['#fff4d6', `📚 צריכה עוד תרגול. ממוצע ב-5 המבחנים האחרונים: ${avg} (עוברים עם ${PASS})`];

  // last 14 days
  const days = [];
  for (let i = 13; i >= 0; i--){ const d = new Date(); d.setDate(d.getDate() - i); days.push([d, (k.days || {})[dkey(d)] || 0]); }
  const maxDay = Math.max(k.goalPerDay || 40, ...days.map(x => x[1]));
  const active = days.filter(x => x[1]).length;

  const goal = p.goal;
  const goalGot = goal ? Math.min(goal.n, exams.filter(e => e.d > goal.setAt && e.score >= PASS).length) : 0;

  app.innerHTML = head + `
  <div class="box">
    <div class="top">
      <div class="ring" style="background:conic-gradient(#8b5cf6 0 ${k.earned}%,#eee8f8 0)"><b>${k.earned}%</b></div>
      <div><h2 style="margin:0">מוכנות למבחן</h2>
      <div class="muted">יודעת ${k.known} מתוך ${k.total} שאלות · ראתה ${k.seen}</div>
      <div class="muted">תרגלה לאחרונה: <b>${ago(k.lastPlayed)}</b></div></div>
    </div>
    <div class="verdict" style="background:${verdict[0]}">${verdict[1]}</div>
    <div class="stats">
      <div><b>🔥 ${k.streak}</b><span>ימים ברצף</span></div>
      <div><b>${k.today}</b><span>שאלות היום (יעד ${k.goalPerDay})</span></div>
      <div><b>${passedAll}/${exams.length}</b><span>מבחנים שעברה</span></div>
    </div>
  </div>

  <div class="box"><h2>📅 שאלות ביום – שבועיים אחרונים</h2>
    <div class="muted">תרגלה ב-${active} מתוך 14 הימים</div>
    <div class="chart">${days.map(([d, n]) => `<div>${n ? `<small>${n}</small>` : ''}<i class="${n >= (k.goalPerDay || 40) ? 'goal' : ''}" style="height:${n / maxDay * 100}%"></i></div>`).join('')}</div>
    <div class="days">${days.map(([d], i) => `<span>${i % 2 && i !== 13 ? '' : d.getDate()}</span>`).join('')}</div>
  </div>

  <div class="box"><h2>📚 לפי נושא</h2>
    ${(k.topics || []).map(t => `<div class="topic"><div><span>${t.icon} ${esc(t.he)}</span><b>${t.known}/${t.total}</b></div><div class="meter"><i style="width:${t.known / t.total * 100}%"></i></div></div>`).join('')}
  </div>

  <div class="box"><h2>📝 מבחנים</h2>
    ${exams.length ? exams.slice().reverse().slice(0, 15).map(e => `<div class="exam"><span class="muted">${dateStr(e.d)}</span><b style="color:${e.score >= PASS ? '#15803d' : '#c0262d'}">${e.score}/30 ${e.score >= PASS ? '✅ עברה' : '❌'}</b></div>`).join('') : '<p class="muted">עוד לא עשתה מבחן</p>'}
  </div>

  <div class="box"><h2>🎯 יעד עם פרס</h2>
    ${goal && !goal.given ? `
      <p>לעבור <b>${goal.n === 1 ? 'מבחן אחד' : goal.n + ' מבחנים'}</b> · הפרס: <b>${esc(goal.prize || 'הפתעה')}</b></p>
      <div class="meter"><i style="width:${goalGot / goal.n * 100}%;background:#ec4899"></i></div>
      <p class="muted" style="margin-top:4px">עברה ${goalGot} מתוך ${goal.n} מאז שנקבע היעד ${goalGot >= goal.n ? '– <b style="color:#15803d">הגיעה ליעד! 🎉</b>' : ''}</p>
      <div class="row">${goalGot >= goal.n ? '<button class="btn" onclick="giveGoal()">🎁 נתתי את הפרס</button>' : ''}<button class="btn light" onclick="cancelGoal()">ביטול היעד</button></div>`
    : `<p class="muted">היא תראה את היעד והפרס במסך הבית שלה, עם פס התקדמות.</p>
      <div class="row"><select id="gn">${[1, 2, 3, 5, 7, 10].map(n => `<option value="${n}" ${n === 3 ? 'selected' : ''}>לעבור ${n} ${n === 1 ? 'מבחן' : 'מבחנים'}</option>`).join('')}</select></div>
      <input id="gp" placeholder="הפרס (למשל: ארוחה במסעדה)">
      <div class="row"><button class="btn" onclick="setGoal()">🎯 לקבוע יעד</button></div>`}
  </div>

  <div class="box"><h2>💌 הודעה לליזה</h2>
    ${p.msg ? `<p style="background:#fff1f7;padding:10px;border-radius:12px">${esc(p.msg)}</p><p class="muted" style="margin-top:4px">מופיעה אצלה במסך הבית</p>` : '<p class="muted">ההודעה תופיע אצלה במסך הבית</p>'}
    <textarea id="msg" rows="2" placeholder="למשל: גאה בך! עוד קצת ואת שם 💜"></textarea>
    <div class="row"><button class="btn" onclick="sendMsg()">שליחה</button>${p.msg ? '<button class="btn light" onclick="clearMsg()">מחיקת ההודעה</button>' : ''}</div>
  </div>

  <div class="box"><h2>❌ השאלות שהכי קשות לה</h2>
    <p class="muted" style="margin-bottom:6px">אפשר לשאול אותה אותן בעל פה 😉</p>
    ${(k.hard || []).length ? k.hard.map(q => `<div class="q">${q.img ? `<img src="img/${esc(q.img)}" alt="">` : ''}<b>${esc(q.q)}</b><br><span class="c">✓ ${esc(q.a)}</span><br><span class="w">טעתה ${q.wrong} ${q.wrong === 1 ? 'פעם' : 'פעמים'} · צדקה ${q.right} ${q.weak ? '' : '· כבר יודעת ✅'}</span><div style="clear:both"></div></div>`).join('') : '<p class="muted">עוד אין טעויות</p>'}
  </div>
  ${linkBox()}
  <p class="center muted">עודכן ${ago(k.lastPlayed)} · גרסת האפליקציה שלה: ${k.version || '?'}</p>`;
}

async function saveParent(parent, done){
  try {
    const res = await (await fetch(SYNC_URL, { method: 'POST', body: JSON.stringify({ action: 'parent', pin, id: liza.id, parent }) })).json();
    if (!res.ok) return toast('לא נשמר, נסה שוב');
    liza.parent = parent; render(); toast(done);
  } catch(e){ toast('אין חיבור לאינטרנט'); }
}
function sendMsg(){
  const t = document.getElementById('msg').value.trim();
  if (!t) return;
  saveParent({ ...liza.parent, msg: t, msgAt: Date.now() }, 'נשלח! היא תראה את זה בפעם הבאה שתפתח 💌');
}
function clearMsg(){ const p = { ...liza.parent }; delete p.msg; delete p.msgAt; saveParent(p, 'ההודעה נמחקה'); }
function setGoal(){
  const n = parseInt(document.getElementById('gn').value, 10), prize = document.getElementById('gp').value.trim();
  saveParent({ ...liza.parent, goal: { n, prize, setAt: Date.now() } }, 'היעד נקבע 🎯');
}
function giveGoal(){ saveParent({ ...liza.parent, goal: { ...liza.parent.goal, given: true, givenAt: Date.now() } }, 'מעולה! אפשר לקבוע יעד חדש 🎯'); }
function cancelGoal(){ const p = { ...liza.parent }; delete p.goal; saveParent(p, 'היעד בוטל'); }

document.addEventListener('visibilitychange', () => { if (!document.hidden && pin && liza) load(); });
load();
</script>
</body>
</html>
